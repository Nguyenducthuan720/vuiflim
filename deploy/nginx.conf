server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 128k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; media-src 'self' https: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://player.phimapi.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
  }
  location /media/ {
    alias /srv/media/;
    autoindex off;
    disable_symlinks on;
    types { video/mp4 mp4; application/vnd.apple.mpegurl m3u8; video/mp2t ts; video/iso.segment m4s; image/jpeg jpg jpeg; image/png png; image/webp webp; text/vtt vtt; }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
    limit_except GET HEAD { deny all; }
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
