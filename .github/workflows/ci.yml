name: Check source
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: vuiphim
      POSTGRES_DB: vuiphim
      POSTGRES_PASSWORD: ci_build_password_not_for_production
      SITE_ADDRESS: http://localhost
      APP_ORIGIN: http://localhost
      COOKIE_SECURE: 'false'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vuiphim
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: vuiphim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://vuiphim:ci_test_password@127.0.0.1:5432/vuiphim_test
      - run: docker compose config --quiet
      - run: docker compose build
